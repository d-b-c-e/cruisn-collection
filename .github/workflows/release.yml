name: release candidate

# Tagging no longer rebuilds and publishes an untested executable. Test the
# downloaded candidate, then promote those exact bytes with promote_release.py.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version (vMAJOR.MINOR.PATCH or prerelease)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate version
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:CANDIDATE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release version' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
      - name: Cache emulator and fallback shaders
        id: mame-cache
        uses: actions/cache@v4
        with:
          path: |
            mame-src/vunit.exe
            mame-src/bgfx
          key: vunit-runtime-v2-${{ hashFiles('patch/vunit-poc-patches.patch') }}
      - name: Build vunit.exe (MAME 0.286 + patch series)
        if: steps.mame-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -e
          export OS=Windows_NT
          git clone --depth 1 --branch mame0286 https://github.com/mamedev/mame mame-src
          cd mame-src
          git config user.email ci@local
          git config user.name ci
          git am ../patch/vunit-poc-patches.patch
          make SUBTARGET=vunit \
               SOURCES=src/mame/midway/midvunit.cpp,src/mame/midway/midzeus.cpp \
               REGENIE=1 NOWERROR=1 TOOLS=0 -j4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m pip install numpy pillow moderngl glfw pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Harness and configuration checks
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Harness tests failed' }
      - name: SDL2 runtime
        shell: msys2 {0}
        run: cp /mingw64/bin/SDL2.dll mame-src/
      - name: Assemble and verify candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          $env:CRUISN_VUNIT = "$PWD\mame-src\vunit.exe"
          .\make_release.ps1 -Version $env:CANDIDATE_VERSION
      - name: Upload exact candidate and manifest
        uses: actions/upload-artifact@v4
        with:
          name: CruisnCollection-${{ inputs.version }}
          path: |
            build/CruisnCollection-*.zip
            build/CruisnCollection-*.zip.check.json
            build/CruisnCollection-*.zip.manifest.json
          if-no-files-found: error
          retention-days: 30

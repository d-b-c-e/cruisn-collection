name: diagnostic checks (manual hosted fallback)

# Local checks are the default: python harness/local_checks.py
# Disabled in GitHub. A new maintainer request is required to re-enable hosted
# compute. Pushes and PRs must not spend Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python harness/local_checks.py --group python --output checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-checks-${{ matrix.os }}
          path: |
            checks/*.json
            checks/*.log
  native-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python harness/local_checks.py --group native --output checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-checks
          path: |
            checks/*.json
            checks/*.log
            checks/*.csv
  gpu-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri xvfb xauth
      - run: python -m pip install -r requirements-test.txt moderngl
      - run: xvfb-run -a python harness/local_checks.py --group gpu --output checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-quality-evidence
          path: |
            checks/*.json
            checks/*.log

# Force-feedback profiles — dbce-wheel-mod-toolkit
#
# Every parameter that decides how a game FEELS, as data. Ships beside the game
# and is read at runtime, so a tune can be changed or swapped without rebuilding
# anything: edit a number, or point the game's config at a different profile,
# and restart it.
#
#   name@version   is the id a game names in its own config, e.g.
#                  FFBProfile = arcade-outrun@1
#
# RULES
#
#   1. A published version is IMMUTABLE. Editing arcade-outrun@1 makes every
#      earlier note about how it drove into a lie. Add @2 instead.
#   2. `inherits` lets a new version state only what it changes, so the diff
#      between two tunes IS the list of what you changed.
#   3. Put your own tunes in force-profiles.user.ini beside this file. That one
#      is never overwritten when the toolkit is updated; this one is.
#   4. An unknown key is reported, not ignored — a typo in a tuning file that
#      silently does nothing is the worst possible outcome.
#
# UNITS
#   strengths      0 is off, 1.0 is full strength for that effect on its own
#   speeds         metres per second, unless the name ends in Kmh
#   seconds, hz    literal
#   shaper.strength 0-100, where 50 means "exactly as tuned"
#
#
# ===========================================================================
# WHAT EACH DIAL DOES, IN PLAIN TERMS
# ===========================================================================
# You do not need to understand the maths to tune this. Change one thing at a
# time, drive, and change it back if it did not help.
#
# --- how heavy the wheel feels ---------------------------------------------
#
#   model.lateral.weight         How much you feel the car leaning on its front
#                                tyres in a corner. This is the main "weight"
#                                dial. Up = heavier in corners.
#
#   model.lateral.forceReference How much tyre force counts as full strength.
#                                CAREFUL, this one is backwards: RAISING it
#                                makes everything LIGHTER, because more force is
#                                now needed to reach full. Use it when the wheel
#                                is generally too strong or too weak everywhere.
#
#   model.lateral.gReference     The same idea for games that only report
#                                cornering g rather than tyre force.
#
#   model.spring.strength        How strongly the wheel pulls back to straight.
#                                This is what makes a wheel feel "connected"
#                                rather than floppy. Arcade games want a lot,
#                                simulators usually want none - a real car
#                                centres itself through the tyres, not a spring.
#
#   model.spring.fullSpeedMps    The speed at which that centring reaches full
#                                strength. Lower = the wheel gets heavy sooner
#                                as you speed up.
#
# --- what happens as you lose grip -----------------------------------------
#
#   model.lateral.trailFloor     How LIGHT the wheel goes when the front tyres
#                                are at their limit. This is your warning that
#                                understeer is coming: a real wheel goes light
#                                just before the front washes out. 1.0 = no
#                                warning at all, 0.6 = a clear one. Lower gives
#                                more warning.
#
#   model.lateral.trailSlipSpan  How far past the tyre's best angle that
#                                lightening takes to arrive. Higher = a slower,
#                                more gradual warning.
#
#   model.lateral.gripLoss       Extra lightening once the car is actually
#                                sliding. The classic arcade cue: the wheel
#                                goes loose in a drift. 0 = off.
#
# --- braking, bumps and bangs ----------------------------------------------
#
#   model.load.weightTransfer    Wheel gets heavier under braking and lighter
#                                under power, as weight moves around the car.
#                                0 = off.
#   model.load.transferMin/Max   Limits on that, so it can never take over.
#
#   model.texture.strength       Buzz from the road surface: gravel, kerbs,
#                                grass. 0 = a completely smooth road.
#   model.texture.hz             How coarse that buzz feels. Lower = a rumble,
#                                higher = a fine vibration.
#
#   model.impact.strength        The kick when you hit something. 0 = no kick.
#   model.impact.seconds         How long that kick lasts.
#
#   model.shift.strength         The thunk through the wheel on a gearchange.
#   model.shift.seconds          How long it lasts.
#
# --- how the force is delivered to the wheel -------------------------------
# These do not invent any force; they shape what the model already produced.
#
#   shaper.strength              Overall level. 50 = exactly as tuned, 100 =
#                                twice as strong, 25 = half. Your wheel's own
#                                driver setting stacks on top of this.
#                                Safe to turn up as of 0.8.0. Before that,
#                                anything above about 65 pinned the wheel at
#                                full force and left it there. Turning it up
#                                still costs contrast - big hits feel less
#                                distinct from hard corners the harder you
#                                drive - so if the wheel is simply too light,
#                                lowering model.lateral.forceReference keeps
#                                more of that contrast than raising this does.
#
#   shaper.invert                Set true if the wheel fights you instead of
#                                helping - it pulls INTO corners rather than
#                                out of them. Some wheels are wired the other
#                                way round; this is the fix, not a tuning dial.
#                                Needs 0.8.0 or later: before that, turning it
#                                on together with shaper.slewPerSecond left the
#                                wheel buzzing with no force at all.
#
#   shaper.deadzone              Ignores very small forces, so the wheel sits
#                                still instead of humming when the car is
#                                parked. Raise slightly if it never settles.
#
#   shaper.attackSmoothing       How quickly force builds up.
#   shaper.decaySmoothing        How quickly it dies away.
#                                Higher = smoother and calmer, but details
#                                arrive late and the wheel feels vague. Lower =
#                                sharper and more informative, but noisier.
#
#   shaper.softSaturation        How gracefully very large forces are squashed
#                                instead of just hitting the ceiling. 1.0 keeps
#                                a crash feeling bigger than a hard corner
#                                instead of both maxing out identically.
#
#   shaper.slewPerSecond         A speed limit on how fast the force may change.
#                                THE FIRST THING TO TRY if a strong wheel
#                                shakes, rattles or oscillates on its own.
#                                Lower = calmer. 0 = no limit.
#
#   shaper.outputDeadband        Skips sending tiny changes to the wheel at all.
#
#   shaper.fadeStartKmh          Below this speed there is no force at all.
#   shaper.fadeFullKmh           By this speed the force is at full strength.
#                                Keeps the wheel quiet in the pits and while
#                                parked, where the numbers the game reports are
#                                meaningless anyway.
#
#   shaper.rampSeconds           Force eases in over this long when it starts,
#                                so the wheel never jerks the moment you load in.
#
#   shaper.peakLimit             A hard ceiling on output, 0 to 1. Lower it if
#                                your wheel is simply too strong at full tilt
#                                and you would rather cap it than retune.
#
#
# ===========================================================================
# IF IT FEELS WRONG, TRY THIS FIRST
# ===========================================================================
#
#   Wheel shakes or rattles by itself      lower shaper.slewPerSecond, then
#                                          raise model.damper.strength
#   Too strong everywhere                  lower shaper.strength, or raise
#                                          model.lateral.forceReference
#   Too weak / feels dead                  lower model.lateral.forceReference,
#                                          or raise shaper.strength; check
#                                          shaper.deadzone is not too high
#   Pulls INTO corners, fights you         shaper.invert = true
#   Vague, mushy, slow to react            lower attackSmoothing and
#                                          decaySmoothing
#   Noisy and nervous                      raise them
#   No warning before understeer           lower model.lateral.trailFloor
#   Floppy and disconnected in the middle  raise model.spring.strength
#   Crashes feel the same as hard corners  raise shaper.softSaturation
#   Wheel twitches while parked            raise shaper.deadzone, or raise
#                                          shaper.fadeStartKmh / fadeFullKmh
#
# Change ONE thing, drive, then decide. Two changes at once and you will not
# know which one did it. Copy a profile into force-profiles.user.ini before you
# start, so the shipped ones stay as a known-good reference.


# ---------------------------------------------------------------------------
# arcade-outrun@1 — OutRun 2006, the constants the game shipped with.
# ---------------------------------------------------------------------------
# Transcribed from OutRun2006Tweaks-FFB's own defaults (src/plugin.hpp, as
# validated at a MOZA R12 on 2026-08-11), so the first drive on the shared model
# is a fair comparison against what the game did before.
#
# Not bit-identical, and two differences are worth knowing before you judge it:
#
#   * The spring's speed curve differs in shape. OutRun used
#     min(1, s/0.25) x (0.35 + 0.65 s) on a normalised speed; the shared model
#     uses a single "full authority at" speed. 22.5 m/s is the closest fit
#     (OutRun's 0.25 of a ~90 m/s top speed) but the knee is softer here.
#   * OutRun's lateral term is a game-specific signal with its own deadzone and
#     /24 normalisation. That extraction stays in the game; only the shaping is
#     shared.
#
[arcade-outrun@1]
description = OutRun 2006 centre-out, constants as shipped 2026-08-11

model.spring.strength          = 0.45
model.spring.fullSpeedMps      = 22.5
model.damper.strength          = 0.10
model.damper.staticFraction    = 0.4
model.lateral.weight           = 0.55
model.lateral.forceReference   = 11500
model.lateral.gReference       = 1.0
model.lateral.trailFloor       = 1.0     # no trail term; OutRun lightens via gripLoss instead
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0.6
model.load.weightTransfer      = 0.8
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0.6
model.texture.hz               = 12
model.impact.strength          = 1.0
model.impact.seconds           = 0.167   # OutRun: 10 frames of active jolt at 60 Hz
model.shift.strength           = 0.3
model.shift.seconds            = 0.05    # OutRun: 3 frames each way

shaper.strength                = 50
shaper.invert                  = false
shaper.deadzone                = 0
shaper.attackSmoothing         = 0.25    # OutRun's dual-rate EMA on the lateral signal
shaper.decaySmoothing          = 0.20
shaper.softSaturation          = 1.0     # tanh
shaper.slewPerSecond           = 3.6     # OutRun: 600 of 10000 per frame at 60 Hz
shaper.outputDeadband          = 0.0015  # OutRun: skip an update under 15 of 10000
shaper.fadeStartKmh            = 0       # no low-speed fade; the spring already scales with speed
shaper.fadeFullKmh             = 0
shaper.rampSeconds             = 0.5     # OutRun's 30-frame warm-up
shaper.peakLimit               = 1.0


# ---------------------------------------------------------------------------
# arcade-outrun@2 — a lighter, less springy variant to drive against @1.
# ---------------------------------------------------------------------------
# The hypothesis worth testing first: OutRun's steering signal is mis-scaled
# (see knowledge/games/outrun-2006.md), so the spring and damper have never
# really been felt, and the tuning above compensated with a heavy lateral term.
# If the steering field turns out to be one of the larger ones, @1 will feel
# harsh and this should feel closer to the cabinet.
#
[arcade-outrun@2]
description = OutRun, lighter lateral and a spring that actually carries the centre
inherits = arcade-outrun@1

model.spring.strength          = 0.60
model.lateral.weight           = 0.35
model.load.weightTransfer      = 0.50
shaper.slewPerSecond           = 5.0


# ---------------------------------------------------------------------------
# arcade-outrun@3 - the same tune with the strength dial turned up.
# ---------------------------------------------------------------------------
# Exists to be driven against @1 on the same session. It changes exactly ONE
# line, shaper.strength, so anything you feel is that dial and nothing else.
#
# It is also the test of the 0.8.0 fix. Before 0.8.0 gain was applied AFTER the
# soft saturation, so strength 75 flattened everything strong into the same
# maximum - a crash and a hard corner both arrived at 1.0000, indistinguishable.
# Gain now runs before the knee, so raising strength drives INTO it.
#
# Measured on this tune at 60 km/h, a hard corner (model 1.0) against a crash
# (model 3.0):
#
#            corner    crash    you feel
#   @1  50   0.7616   0.9951      0.2335
#   @3  75   0.9051   0.9998      0.0946      <- 0.0000 before 0.8.0
#
# So @3 is about 19% stronger at a hard corner and still tells a crash apart,
# where the old code told you nothing at all. The trade is real and visible in
# that table: driving further into the knee buys weight and spends contrast.
# If @3 feels strong but numb, that is the trade, and @1 is the answer.
#
[arcade-outrun@3]
description = OutRun @1 with strength 75, to drive against @1 on the same session
inherits = arcade-outrun@1

shaper.strength                = 75


# ---------------------------------------------------------------------------
# simlite@1 - SUPERSEDED BY simlite@2. Its MODEL half is art of rally's; its

# ---------------------------------------------------------------------------
# simlite@2 - art of rally 0.2.2, corrected against its own force curve.
# ---------------------------------------------------------------------------
# Every value here is evidenced by the conformance vector in
# dotnet/Dbce.Wheel.Ffb.Tests/data/art-of-rally-0.2.2-force-curve.csv, which
# that repo generated from its shipping ForceCurve.cs rather than by
# transcription. SimLiteVectorTests holds this profile to it.
#
# What changed from @1, and why: the shaper conditioning is off, not defaulted.
# The curve shows no deadzone (500 N at 5 km/h gives 0.005487, undiminished),
# no output deadband (it sends 54, not 0), no soft saturation and no slew. The
# smoothing is one SYMMETRIC coefficient shipped at 0.2, so attack and decay
# are equal here - they have to be for the two implementations to agree at all.
#
# One convention to know before comparing numbers by hand: this model returns a
# NEGATIVE force for a positive lateral load, because positive means "toward
# positive steer" and centring is the opposite.
#
# Clamping order agreed in 0.7.0. Art of rally fades then clamps; this pipeline
# used to clamp inside the model, and the two diverged whenever the force
# exceeded full scale AND the speed fade was partial - a low-speed slide. The
# model now returns what it computed and the shaper bounds it at the device
# edge, so the two agree on every row of the curve, saturating ones included.
#
[simlite@2]
description = art of rally 0.2.2, verified against its own force curve

model.spring.strength          = 0
model.spring.fullSpeedMps      = 30
model.damper.strength          = 0
model.damper.staticFraction    = 0.4
model.lateral.weight           = 1.0
model.lateral.forceReference   = 11500
model.lateral.gReference       = 1.2
model.lateral.trailFloor       = 0.6
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0
model.load.weightTransfer      = 0
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0
model.texture.hz               = 12
model.impact.strength          = 0
model.impact.seconds           = 0.12
model.shift.strength           = 0
model.shift.seconds            = 0.04

shaper.strength                = 50      # gain 1.0
shaper.invert                  = false
shaper.deadzone                = 0       # the curve shows none
shaper.attackSmoothing         = 0.2     # one symmetric coefficient, so both
shaper.decaySmoothing          = 0.2     # halves must match
shaper.softSaturation          = 0
shaper.slewPerSecond           = 0
shaper.outputDeadband          = 0
shaper.fadeStartKmh            = 3
shaper.fadeFullKmh             = 12
shaper.rampSeconds             = 0
shaper.peakLimit               = 1.0


# ---------------------------------------------------------------------------
# cruisn-vunit@1 - Cruis'n USA / World / Off Road Challenge, as mvffb shipped.
# ---------------------------------------------------------------------------
# A SHAPER-ONLY profile. Cruis'n is the first consumer with no physics at all:
# the arcade board hands over a finished signed motor byte, so there is nothing
# for the force model to compute and every model.* value below is inert. Only
# the shaper runs.
#
# This reproduces the conditioning that vunit.exe's built-in FFB (mvffb) was
# doing by hand at v0.3.7, so the conversion changes the code path without
# changing the feel. The mapping is exact rather than approximate:
#
#   their |byte|/126, signed        -> the shaper's normalised input
#   their smooth 50 ms low-pass     -> shaper.smoothingMs   = 50
#   their |dwant| >= full x 0.6     -> shaper.impulseBypass = 0.6
#   their want==0 and |out| < 160   -> shaper.settleBelow   = 160/32767
#   their |out - applied| >= 33     -> shaper.releveling    =  33/32767
#
# The two thresholds are stated in DEVICE units (fractions of full scale) and
# are applied after the gain, exactly where the originals were, so they stay
# correct at any FFB STRENGTH. impulseBypass is checked before the gain, which
# is equivalent because the gain is linear: |dwant| >= 0.6 x full is the same
# statement as |dp| >= 0.6.
#
# NOT here on purpose:
#   strength   the launcher's FFB STRENGTH row keeps its own meaning and is
#              applied at run time. Note their scale is a plain percent while
#              shaper.strength is 50-is-unity, so 50% maps to Strength 25.
#              Getting that wrong squares the gain - see docs/CONSUMING.md.
#   slew       theirs runs driver-side on the motor byte, before any of this
#   rumble, damper, friction   device effects, not shaping
#   fade       there is no speed signal to fade against
#
[cruisn-vunit@1]
description = Cruis'n USA/World/Off Road, mvffb v0.3.7 conditioning reproduced

model.spring.strength          = 0
model.spring.fullSpeedMps      = 30
model.damper.strength          = 0
model.damper.staticFraction    = 0.4
model.lateral.weight           = 0
model.lateral.forceReference   = 11500
model.lateral.gReference       = 1.2
model.lateral.trailFloor       = 1.0
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0
model.load.weightTransfer      = 0
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0
model.texture.hz               = 12
model.impact.strength          = 0
model.impact.seconds           = 0.12
model.shift.strength           = 0
model.shift.seconds            = 0.04

shaper.strength                = 50      # unity; FFB STRENGTH overrides at run time
shaper.invert                  = false   # sign is device wiring, handled in midv_ffb_write
shaper.deadzone                = 0
shaper.attackSmoothing         = 0       # superseded by smoothingMs
shaper.decaySmoothing          = 0
shaper.softSaturation          = 0
shaper.slewPerSecond           = 0       # theirs is driver-side, on the byte
shaper.outputDeadband          = 0
shaper.fadeStartKmh            = 0       # no speed signal
shaper.fadeFullKmh             = 0
shaper.rampSeconds             = 0
shaper.peakLimit               = 1.0
shaper.smoothingMs             = 50
shaper.impulseBypass           = 0.6
shaper.settleBelow             = 0.004883
shaper.releveling              = 0.001007


# ---------------------------------------------------------------------------
# cruisn-vunit@2 - a crisper centre. UNVERIFIED: drive it against @1.
# ---------------------------------------------------------------------------
# Reported 2026-09-04: "the self-centring right near the centre feels a little
# looser than normal". This is one of the two candidates, and the only one that
# lives in a profile.
#
# Near the straight-ahead position the game's own centring force is SMALL and
# changes quickly. A 50 ms low-pass reaches 95% of a new value in about 150 ms,
# which is long enough to round the edge off exactly those small fast
# corrections while leaving big forces untouched - which is what "loose in the
# middle but fine elsewhere" sounds like. 20 ms gets there in about 60 ms.
#
# Changes ONE line against @1 so the A/B is clean.
#
# The other candidate is NOT in here because it is not a shaping parameter:
# [collection] ffb_rumble defaults to 100 and fires a 100 ms rumble burst on
# every motor-byte change, which on a 60 Hz game means a permanently restarting
# full-scale periodic effect competing with the constant force. Test that with
# ffb_rumble = 0 SEPARATELY, or you will not know which one did it.
#
[cruisn-vunit@2]
description = Cruis'n with a 20 ms filter, testing the loose-centre report
inherits = cruisn-vunit@1

shaper.smoothingMs             = 20



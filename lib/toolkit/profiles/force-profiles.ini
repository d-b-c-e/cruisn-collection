model.lateral.gReference       = 1.2
model.lateral.trailFloor       = 0.6
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0
model.load.weightTransfer      = 0
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0
model.texture.hz               = 12
model.impact.strength          = 0
model.impact.seconds           = 0.12
model.shift.strength           = 0
model.shift.seconds            = 0.04

shaper.strength                = 50
shaper.invert                  = false
shaper.deadzone                = 0.0015
shaper.attackSmoothing         = 0.2
shaper.decaySmoothing          = 0.2
shaper.softSaturation          = 0
shaper.slewPerSecond           = 0
